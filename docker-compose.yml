name: ringee-stack

services:
  ringee-postgres:
    image: postgres:17-alpine
    container_name: ringee-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ringee-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ringee-password}
      POSTGRES_DB: ${POSTGRES_DB:-ringee-db-local}
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - ringee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ringee-user} -d ${POSTGRES_DB:-ringee-db-local} -h 127.0.0.1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - ringee-network

  ringee-redis:
    image: redis:7.4-alpine
    container_name: ringee-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    expose:
      - "6379"
    volumes:
      - ringee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ringee-network

  ringee-temporal:
    image: temporalio/auto-setup:1.25
    container_name: ringee-temporal
    expose:
      - "7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: ringee-postgres
      POSTGRES_USER: ${POSTGRES_USER:-ringee-user}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ringee-password}
    depends_on:
      ringee-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ringee-network

  ringee-temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: ringee-temporal-ui
    expose:
      - "8080"
    environment:
      TEMPORAL_ADDRESS: ringee-temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    depends_on:
      - ringee-temporal
    restart: unless-stopped
    networks:
      - ringee-network
      - coolify

volumes:
  ringee_pg_data:
  ringee_redis_data:

networks:
  ringee-network:
    driver: bridge
  coolify:
    external: true
